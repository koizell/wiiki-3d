name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npx eslint src

      - name: Build
        run: npm run build
        env:
          VITE_JEV_PROXY_URL: ${{ vars.JEV_PROXY_URL || secrets.JEV_PROXY_URL || 'https://wiiki-3d-jev-proxy.wiiki3d-site.workers.dev' }}
          VITE_JEV_USE_MOCK: ${{ vars.JEV_USE_MOCK || secrets.JEV_USE_MOCK || 'true' }}

      # La revisión de AdSense está abierta: esto no es un capricho, es la
      # razón por la que `/wiki/stringing/` llegó a producción con un 404. Una
      # guía escrita y no registrada no rompe el build —compila igual— pero
      # desaparece del sitio. Tarda un segundo y no necesita navegador.
      - name: Blindaje de la revisión
        run: npm run verify:revision

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4