name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npx eslint src

      - name: Build
        run: npm run build
        env:
          VITE_JEV_PROXY_URL: ${{ vars.JEV_PROXY_URL || secrets.JEV_PROXY_URL || 'https://wiiki-3d-jev-proxy.wiiki3d-site.workers.dev' }}
          VITE_JEV_USE_MOCK: ${{ vars.JEV_USE_MOCK || secrets.JEV_USE_MOCK || 'true' }}

      # La revisión de AdSense está abierta: esto no es un capricho, es la
      # razón por la que `/wiki/stringing/` llegó a producción con un 404. Una
      # guía escrita y no registrada no rompe el build —compila igual— pero
      # desaparece del sitio. Tarda un segundo y no necesita navegador.
      - name: Blindaje de la revisión
        run: npm run verify:revision

      # El contenido de la wiki no lo comprueba el compilador. Una guía puede
      # tener un `puntos` de 300 caracteres, un `porque` que se ha comido un dato
      # o un resumen que dice lo contrario que la tarjeta de al lado: el build
      # pasa igual y el sitio sale mal.
      #
      # Estos tres no necesitan red ni navegador, así que pueden ir antes del
      # build. `verify:wiki` contrasta las afirmaciones con `wiki/raw/`.
      - name: Blindaje del contenido
        run: npm run verify:contenido

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # Y ya con el sitio construido: los enlaces internos que no dan 200, y el
      # `description` de cada guía —que es donde se publica el `resumen`.
      - name: Blindaje de lo construido
        run: npm run verify:dist

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4