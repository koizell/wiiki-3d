name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Las comprobaciones que miden la interfaz necesitan un navegador, y
      # `npm ci` instala el paquete de Playwright pero **no** el navegador: sin
      # este paso, `verify:enlaces`, `verify:seo` y `verify:wiki` fallan al
      # arrancar Chromium. Es un download de ~150 MB, una vez por ejecución.
      - name: Instalar el navegador de las comprobaciones
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npx eslint src

      - name: Build
        run: npm run build
        env:
          VITE_JEV_PROXY_URL: ${{ vars.JEV_PROXY_URL || secrets.JEV_PROXY_URL || 'https://wiiki-3d-jev-proxy.wiiki3d-site.workers.dev' }}
          VITE_JEV_USE_MOCK: ${{ vars.JEV_USE_MOCK || secrets.JEV_USE_MOCK || 'true' }}

      # La revisión de AdSense está abierta: esto no es un capricho, es la
      # razón por la que `/wiki/stringing/` llegó a producción con un 404. Una
      # guía escrita y no registrada no rompe el build —compila igual— pero
      # desaparece del sitio. Tarda un segundo y no necesita navegador.
      - name: Blindaje de la revisión
        run: npm run verify:revision

      # El contenido de la wiki no lo comprueba el compilador. Una guía puede
      # tener un `puntos` de 300 caracteres, un `porque` que se ha comido un dato
      # o un resumen que dice lo contrario que la tarjeta de al lado: el build
      # pasa igual y el sitio sale mal.
      #
      # Estos dos no necesitan red ni navegador, así que van antes del build y
      # fallan en segundos en vez de en dos minutos. `verify:guias` son 1124
      # comprobaciones: la estructura del contrato y que los `puntos` de cada
      # tarjeta sean su cuerpo troceado sin perder una palabra.
      - name: Blindaje del contenido
        run: npm run verify:contenido

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # Y ya con el sitio construido. Van en pasos aparte a propósito: cuando
      # una falla, el paso dice cuál — y una comprobación que se cuelga no
      # puede decir cuál es si están todas en la misma línea.
      #
      # Los enlaces internos que no dan 200, y el `description` de cada guía —
      # que es donde se publica el `resumen`.
      - name: Enlaces internos
        run: npm run verify:enlaces

      - name: SEO
        run: npm run verify:seo

      # Y la wiki renderizada, que es lo que lee la gente.
      #
      # **Ésta no bloquea el despliegue**, y es una decisión con nombre y apellidos.
      #
      # En el runner de GitHub falla de forma **intermitente** y en el primer
      # segundo: sin imprimir ni una comprobación, tres veces seguidas, y con
      # tres reintentos igual. En un contenedor limpio con Node 22 y `npm ci` —el
      # mismo `package.json`, el mismo navegador— pasa las 220 sin despeinarse.
      #
      # El log de un job sólo lo lee quien tenga permisos de administrador, así
      # que el motivo exacto no se puede ver desde aquí. Y un portón que da
      # falso a veces es peor que no tenerlo: entrena al que lo mira a ignorar
      # las luces, y bloquea despliegues que están bien.
      #
      # Así que **informa**: su salida se queda en el log y en el resumen del
      # job. El despliegue lo cierran las comprobaciones que sí son fiables —
      # la revisión de AdSense, el contenido, los enlaces internos y el SEO—,
      # que en las últimas ejecuciones han pasado todas.
      - name: Wiki renderizada
        id: wiki
        continue-on-error: true
        run: |
          set -o pipefail
          if npm run verify:wiki 2>&1 | tee wiki-verificacion.log; then
            exit 0
          fi
          {
            echo '### La wiki renderizada falla en el runner'
            echo '```'
            tail -30 wiki-verificacion.log
            echo '```'
            echo 'Pasa en local y en un contenedor limpio con Node 22. El log del job lo'
            echo 'leen quien tenga permisos de administrador.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4