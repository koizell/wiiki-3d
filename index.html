<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      El icono de iOS no admite SVG: es un PNG de 180×180 con el fondo oscuro
      incrustado (un PNG transparente se ve con un recuadro blanco al añadirlo a
      la pantalla de inicio). El `manifest` da el nombre y los iconos cuando la
      app se instala como acceso directo.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Las fuentes, por adelantado.

      La spec de identidad visual (§4) las manda con `font-display: swap` y con un
      `preload` para los pesos de la primera pantalla. El `preload` **faltaba**, y su
      ausencia se medía: sin él, el navegador pinta con la fuente del sistema y al
      llegar la de Plex **todo el texto se mueve**. Medido en la guía: un desplazamiento
      acumulado de 0.586, que es un CLS de casi seis décimas.

      Con el `preload` la fuente llega antes del primer pintado y el texto no se
      mueve. El `crossorigin` es obligatorio: las fuentes se piden en modo CORS
      aunque se sirvan del mismo origen, y sin él el navegador las descarga dos
      veces y la precarga no sirve de nada.
    -->
    <link
      rel="preload"
      href="/fuentes/plex-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fuentes/plex-mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fuentes/plex-mono-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Pinta la barra del navegador móvil con el fondo de la app. Sin esto el
      navegador usa su color por defecto (claro) y la app oscura queda encajada en
      una franja blanca, que es justo la sensación que se quiere evitar al
      hacer el layout responsivo.
    -->
    <meta name="theme-color" content="#0f1115" />
    <!--
      Descripción para buscadores. Redactada en español porque es el idioma de la
      interfaz, y limitada a una frase porque los buscadores recortan alrededor de
       160 caracteres. La exportación estática añade los metadatos de cada ruta.
    -->
    <meta
      name="description"
      content="Analiza metadatos de G-code, consulta guías con fuentes sobre impresión 3D y calcula el coste de tus piezas. Visor local para modelos STL y 3MF."
    />
    <title>wiiki-3d: análisis de G-code y guías de impresión 3D</title>
    <!--
      Tarjeta para redes sociales (Open Graph y Twitter). Estos son los valores de
      la raíz; la exportación estática los reescribe por ruta, igual que el título
      y la descripción. `og:image` es la misma para todo el sitio —una portada de
      1200×630— porque no hay una imagen por página que merezca la pena.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="wiiki-3d" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="wiiki-3d: análisis de G-code y guías de impresión 3D" />
    <meta
      property="og:description"
      content="Analiza metadatos de G-code, consulta guías con fuentes sobre impresión 3D y calcula el coste de tus piezas."
    />
    <meta property="og:url" content="https://wiiki-3d.com/" />
    <meta property="og:image" content="https://wiiki-3d.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Ilustración de una impresora 3D con una pieza a medio imprimir y un panel de análisis."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="wiiki-3d: análisis de G-code y guías de impresión 3D" />
    <meta
      name="twitter:description"
      content="Analiza metadatos de G-code, consulta guías con fuentes sobre impresión 3D y calcula el coste de tus piezas."
    />
    <meta name="twitter:image" content="https://wiiki-3d.com/og.png" />
    <!--
      Declara la cuenta de AdSense dueña del dominio: es la verificación de
      propiedad. El pub-ID es el mismo que el de `public/ads.txt`, en su
      variante `ca-pub`.
    -->
    <meta name="google-adsense-account" content="ca-pub-1976099124866284" />
    <!--
      El aviso europeo de consentimiento («Privacidad y mensajes») necesita que
      la política de referrer comparta el encabezado `Referer` en peticiones
      cross-origin. Los navegadores actuales ya usan este mismo valor por
      defecto; se fija aquí para no depender de ninguno.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!--
      Consentimiento (Consent Mode v2), denegado por defecto y declarado ANTES
      de que cargue cualquier etiqueta de Google. Los cuatro parámetros de v2
      son `ad_storage`, `ad_user_data`, `ad_personalization` y
      `analytics_storage`.

      Quien actualiza el estado es el aviso europeo, con el Consent Mode
      activado en su configuración (en advanced mode no exige nada más en la
      página). El aviso llega solo a visitantes del EEE, Reino Unido y Suiza;
      fuera de ahí el estado se queda denegado, como promete la política de
      privacidad.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        window.dataLayer.push(arguments);
      }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500,
      });
    </script>
    <!--
      Etiqueta de AdSense. Aún no sirve anuncios (el sitio está en revisión),
      pero es imprescindible desde ya: sin ella Google no puede mostrar el
      aviso europeo de consentimiento (requisito de «Privacidad y mensajes»).
    -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1976099124866284"
      crossorigin="anonymous"
    ></script>

    <!--
      Medida de audiencia: GA4 (ID real en GA_ID; el snippet ya se inyecta).
      Runbook manual en docs/medicion-setup.md.
    -->
    <script>
      const GA_ID = 'G-6W0LKP3ETS';
      if (GA_ID !== 'G-XXXXXXXXXX') {
        const etiqueta = document.createElement('script');
        etiqueta.async = true;
        etiqueta.src = `https://www.googletagmanager.com/gtag/js?id=${GA_ID}`;
        document.head.appendChild(etiqueta);
        gtag('js', new Date());
        gtag('config', GA_ID);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
