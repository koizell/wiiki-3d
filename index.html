    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Pinta la barra del navegador móvil con el fondo de la app. Sin esto el
      navegador usa su color por defecto (claro) y la app oscura queda encajada en
      una franja blanca, que es justo la sensación que se quiere evitar al
      hacer el layout responsivo.
    -->
    <meta name="theme-color" content="#0f1115" />
    <!--
      Descripción para buscadores. Redactada en español porque es el idioma de la
      interfaz, y limitada a una frase porque los buscadores recortan alrededor de
      160 caracteres. No se menciona la wiki porque todavía no existe.
    -->
    <meta
      name="description"
      content="Análisis técnico de G-code: material, temperaturas, altura de capa, tiempo y filamento, con diagnóstico de riesgo de Jev. Visor 3D para STL y 3MF."
    />
    <title>wiiki-3d</title>
  </head>
